[package]
name = "lumen"
description = "Lumen Video Editor desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "lumen"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["lumen-engine/whisper", "lumen-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["lumen-engine/neural-voices"]

[dependencies]
lumen-engine = { workspace = true }
lumen-format = { workspace = true }
lumen-export = { workspace = true }
lumen-project = { workspace = true }
lumen-render = { workspace = true }
lumen-time = { workspace = true }
lumen-gpu = { workspace = true }
lumen-ui-egui = { workspace = true }
lumen-platform = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.16"
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About / Home links in the system browser (MIT; as PhotoCraft).
open = "5"
# The window's size, position and maximized state between launches (window.rs); macOS event-loop
# options (no app activation when driven by an agent). The same winit eframe runs on.
winit = { version = "0.30", default-features = false }
serde = { workspace = true }

[dev-dependencies]
glob = "0.3"
# graphics.rs: enumerate the real adapters in a test.
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "5.19"

# Icon + VERSIONINFO for lumen.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
