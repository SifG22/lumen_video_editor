[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/SifG22/lumen_video_editor"

[workspace.dependencies]
# internal
lumen-time = { path = "crates/time" }
lumen-geom = { path = "crates/geom" }
lumen-color = { path = "crates/color" }
lumen-bitstream = { path = "crates/bitstream" }
lumen-isobmff = { path = "crates/isobmff" }
lumen-avi = { path = "crates/avi" }
lumen-matroska = { path = "crates/matroska" }
lumen-mxf = { path = "crates/mxf" }
lumen-cfb = { path = "crates/cfb" }
lumen-mpegts = { path = "crates/mpegts" }
lumen-mpeg2v = { path = "crates/mpeg2v" }
lumen-ac3 = { path = "crates/ac3" }
lumen-mpa = { path = "crates/mpa" }
lumen-ogg = { path = "crates/ogg" }
lumen-h264 = { path = "crates/h264" }
lumen-hevc = { path = "crates/hevc" }
lumen-vp8 = { path = "crates/vp8" }
lumen-vp9 = { path = "crates/vp9" }
lumen-prores = { path = "crates/prores" }
lumen-dnx = { path = "crates/dnx" }
lumen-apv = { path = "crates/apv" }
lumen-dng = { path = "crates/dng" }
lumen-av1 = { path = "crates/av1" }
lumen-aac = { path = "crates/aac" }
lumen-flac = { path = "crates/flac" }
lumen-opus = { path = "crates/opus" }
lumen-h264enc = { path = "crates/h264enc" }
lumen-audio-dsp = { path = "crates/audio-dsp" }
lumen-frame = { path = "crates/frame" }
lumen-media = { path = "crates/media" }
lumen-codecs = { path = "crates/codecs" }
lumen-project = { path = "crates/project" }
lumen-edit = { path = "crates/edit" }
lumen-interchange = { path = "crates/interchange" }
lumen-text = { path = "crates/text" }
lumen-captions = { path = "crates/captions" }
lumen-speech = { path = "crates/speech" }
lumen-tts = { path = "crates/tts" }
lumen-tts-text = { path = "crates/tts-text" }
lumen-render = { path = "crates/render" }
lumen-gpu = { path = "crates/gpu" }
lumen-scopes = { path = "crates/scopes" }
lumen-export = { path = "crates/export" }
lumen-format = { path = "crates/format" }
lumen-engine = { path = "crates/engine" }
lumen-ui-egui = { path = "crates/ui-egui" }
lumen-automation = { path = "crates/automation" }
lumen-platform = { path = "crates/platform" }
lumen-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.lumen-h264]
opt-level = 3

[profile.dev.package.lumen-h264enc]
opt-level = 3

[profile.dev.package.lumen-hevc]
opt-level = 3

[profile.dev.package.lumen-prores]
opt-level = 3

[profile.dev.package.lumen-dnx]
opt-level = 3

[profile.dev.package.lumen-apv]
opt-level = 3

[profile.dev.package.lumen-dng]
opt-level = 3

[profile.dev.package.lumen-av1]
opt-level = 3

[profile.dev.package.lumen-aac]
opt-level = 3

[profile.dev.package.lumen-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.lumen-audio-dsp]
opt-level = 3

[profile.dev.package.lumen-mxf]
opt-level = 3

[profile.dev.package.lumen-opus]
opt-level = 3

[profile.dev.package.lumen-vp8]
opt-level = 3

[profile.dev.package.lumen-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
