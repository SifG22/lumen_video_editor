[package]
name = "lumen-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lumen-time = { workspace = true }
lumen-geom = { workspace = true }
lumen-color = { workspace = true }
lumen-frame = { workspace = true }
lumen-media = { workspace = true }
lumen-project = { workspace = true }
lumen-audio-dsp = { workspace = true }
lumen-captions = { workspace = true }
lumen-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
