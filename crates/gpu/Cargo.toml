[package]
name = "lumen-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lumen-color = { workspace = true }
lumen-frame = { workspace = true }
lumen-geom = { workspace = true }
lumen-project = { workspace = true }
lumen-render = { workspace = true }
lumen-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "0.4"
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
lumen-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
lumen-media = { workspace = true }
lumen-time = { workspace = true }
