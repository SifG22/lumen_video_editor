[package]
name = "lumen-engine"
description = "Lumen Video Editor engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["lumen-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["lumen-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["lumen-tts/kokoro", "speech-download"]

[dependencies]
lumen-time = { workspace = true }
lumen-geom = { workspace = true }
lumen-color = { workspace = true }
lumen-frame = { workspace = true }
lumen-media = { workspace = true }
lumen-codecs = { workspace = true }
lumen-project = { workspace = true }
lumen-edit = { workspace = true }
lumen-render = { workspace = true }
lumen-scopes = { workspace = true }
lumen-text = { workspace = true }
lumen-audio-dsp = { workspace = true }
lumen-export = { workspace = true }
lumen-mxf = { workspace = true }
lumen-format = { workspace = true }
lumen-interchange = { workspace = true }
lumen-captions = { workspace = true }
lumen-speech = { workspace = true }
lumen-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
lumen-testkit = { workspace = true }
lumen-dng = { workspace = true, features = ["writer"] }
lumen-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
