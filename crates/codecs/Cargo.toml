[package]
name = "lumen-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lumen-time = { workspace = true }
lumen-color = { workspace = true }
lumen-frame = { workspace = true }
lumen-media = { workspace = true }
lumen-avi = { workspace = true }
lumen-isobmff = { workspace = true }
lumen-matroska = { workspace = true }
lumen-mxf = { workspace = true }
lumen-mpegts = { workspace = true }
lumen-mpeg2v = { workspace = true }
lumen-ac3 = { workspace = true }
lumen-mpa = { workspace = true }
lumen-ogg = { workspace = true }
lumen-bitstream = { workspace = true }
lumen-h264 = { workspace = true }
lumen-hevc = { workspace = true }
lumen-vp8 = { workspace = true }
lumen-vp9 = { workspace = true }
lumen-prores = { workspace = true }
lumen-dnx = { workspace = true }
lumen-av1 = { workspace = true }
lumen-apv = { workspace = true }
lumen-aac = { workspace = true }
lumen-opus = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
lumen-testkit = { workspace = true }
serde_json = { workspace = true }
